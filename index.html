<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tidy | Tidy</title><link rel="icon" href="icon.png"><style>*{box-sizing:border-box}
:root{--canvas:#fff;--card:#EEF1FD;--title:#0B0F19;--body:#3C4252;--muted:#8A8F9C;--line:#E3E7F2;--accent:#2F6BFF;--tint:rgba(47,107,255,.12)}
@media (prefers-color-scheme:dark){:root{--canvas:#000;--card:#171A23;--title:#F4F5F8;--body:#C7CAD3;--muted:#8E93A0;--line:#2B2F3B;--tint:rgba(47,107,255,.22)}}
body{margin:0;background:var(--canvas);color:var(--body);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding:16px 20px 80px}
header{display:flex;justify-content:space-between;align-items:center;height:52px}
header a{color:var(--accent);text-decoration:none;font-size:16px;font-weight:600}
h1{font-size:28px;line-height:1.3;color:var(--title);margin:8px 0 20px;font-weight:800}
.card{background:var(--card);border-radius:24px;padding:22px 20px;margin:0 0 28px}
.about{display:flex;gap:16px;align-items:flex-start}
.about img{width:56px;height:56px;border-radius:13px;flex:none}
.about b{display:block;color:var(--title);font-size:17px;margin:0 0 4px}
.about p{margin:0;font-size:15px;line-height:1.55}
.rule{height:1px;background:var(--line);margin:18px 0}
.pt{display:flex;gap:12px;align-items:flex-start;margin:0 0 16px}
.ic{flex:none;width:40px;height:40px;border-radius:20px;background:var(--tint);display:flex;align-items:center;justify-content:center}
.ic svg{width:21px;height:21px;fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.pt b{display:block;color:var(--title);font-size:17px;line-height:1.4}
.pt span{display:block;font-size:15px;line-height:1.5;margin-top:2px}
.date{color:var(--muted);font-size:13px;margin:4px 0 0}
section{padding:20px 0;border-top:1px solid var(--line)}section:first-of-type{border-top:0}
.h{display:flex;gap:12px;align-items:center;margin:0 0 8px}
.n{flex:none;width:28px;height:28px;border-radius:9px;background:var(--tint);color:var(--accent);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center}
h2{margin:0;font-size:17px;line-height:1.4;color:var(--title)}
section p,section ul{margin:0 0 10px;font-size:15px;line-height:1.7}section ul{padding-left:1.2em}
.links a{display:flex;justify-content:space-between;align-items:center;padding:16px 4px;border-top:1px solid var(--line);color:var(--title);text-decoration:none;font-size:17px}
.links a:first-child{border-top:0}.links a:after{content:"›";color:var(--muted);font-size:22px}
footer{margin-top:48px;color:var(--muted);font-size:13px;text-align:center}
footer a,p a{color:var(--accent)}</style></head><body><div class="wrap"><header><span></span><a href="en/" hreflang="en">English</a></header><div class="card" style="margin-top:12px"><div class="about"><img src="icon.png" alt=""><div><b style="font-size:24px">Tidy</b><p>iPhoneの容量を空けるための写真整理アプリです。重複した写真、似た写真、ぼやけた写真をまとめて見つけて、ワンタップで整理できます。写真はすべて端末の中だけで解析され、どこにも送信されません。</p></div></div></div><div class="card links" style="padding:4px 18px"><a href="./privacy.html">プライバシーポリシー</a><a href="./terms.html">利用規約</a></div><p style="font-size:15px;line-height:1.7">ご意見・不具合のご報告は<a href="https://docs.google.com/forms/d/e/1FAIpQLSeF3M7rD9W3L2nW9WDEiNvz2GokXoxXCdwTNIpGnbyvcoh4lA/viewform">お問い合わせフォーム</a>からお願いします。</p><footer>Tidy · <a href="https://docs.google.com/forms/d/e/1FAIpQLSeF3M7rD9W3L2nW9WDEiNvz2GokXoxXCdwTNIpGnbyvcoh4lA/viewform">お問い合わせ</a></footer></div></body></html>
